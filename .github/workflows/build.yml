name: Build TML Admin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download latest stable tModLoader from GitHub
        shell: pwsh
        run: |
          $release = Invoke-RestMethod "https://api.github.com/repos/tModLoader/tModLoader/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -eq "tModLoader.zip" } | Select-Object -First 1
          if (-not $asset) {
            throw "The latest stable tModLoader release did not contain tModLoader.zip."
          }

          $zipPath = Join-Path $env:RUNNER_TEMP "tModLoader.zip"
          $installDir = Join-Path $env:RUNNER_TEMP "tModLoader"
          Invoke-WebRequest $asset.browser_download_url -OutFile $zipPath
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          Expand-Archive -Path $zipPath -DestinationPath $installDir -Force

          $tmlDll = Get-ChildItem -Path $installDir -Filter "tModLoader.dll" -Recurse -File | Select-Object -First 1
          if (-not $tmlDll) {
            throw "tModLoader.dll was not found after extracting the official release."
          }

          "TMODLOADER_DLL=$($tmlDll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build mod
        shell: pwsh
        run: |
          $saveDir = Join-Path $env:RUNNER_TEMP "tml-save"
          $modSourceDir = Join-Path $env:RUNNER_TEMP "TMLAdmin"
          New-Item -ItemType Directory -Force -Path $saveDir | Out-Null
          New-Item -ItemType Directory -Force -Path $modSourceDir | Out-Null
          $sourcePattern = Join-Path $env:GITHUB_WORKSPACE "*"
          Copy-Item -Path $sourcePattern -Destination $modSourceDir -Recurse -Force

          & dotnet "$env:TMODLOADER_DLL" -tmlsavedirectory "$saveDir" -build "$modSourceDir"
          if ($LASTEXITCODE -ne 0) {
            throw "tModLoader build failed (exit code $LASTEXITCODE)."
          }

          $modFile = Get-ChildItem -Path $saveDir -Filter "TMLAdmin.tmod" -Recurse -File | Select-Object -First 1
          if (-not $modFile) {
            throw "Build finished but TMLAdmin.tmod was not found in the build output."
          }

          New-Item -ItemType Directory -Force -Path "artifact" | Out-Null
          Copy-Item $modFile.FullName "artifact/TMLAdmin.tmod"

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: TMLAdmin-tmod
          path: artifact/TMLAdmin.tmod
          if-no-files-found: error
